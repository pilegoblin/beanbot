# fly.toml app configuration file generated for beanbot-drew on 2024-02-28T14:53:24-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'beanbot-drew'
primary_region = 'iad'

[build]

# BeanBot's Memory. A volume binds to one machine, so deploys stop and restart
# rather than rolling. Create it with:
#   fly volumes create beanbot_memory -r iad -s 1
[mounts]
  source = 'beanbot_memory'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = ''
  internal_port = 0
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  ports = []

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
